name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Build
        run: npx astro build
        env:
          # Placeholders so build doesn't fail when env vars aren't set in CI
          PUBLIC_GOOGLE_MAPS_KEY: ""
          CF_ANALYTICS_TOKEN: ""

      # Runs in your copy of the template, not in the template repo itself (which is all placeholders by design).
      - name: Check for placeholders
        if: github.repository != 'jonblakesilva/local-service-template'
        run: node scripts/check-placeholders.js
